[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaxiu-swarm"
version = "0.3.3"
description = "Multi-provider agent swarm orchestration: Kimi CLI + Kimi Coding API + DeepSeek + Qwen + Claude. asyncio.gather + git worktree isolation. Pre-authored packets + AG#1 source-trace meta-review. v0.3.3 (G36): --no-thinking flag + DEEPSEEK_DISABLE_THINKING env to opt out of v4-* thinking-mode extra_body (v0.3.1 G34 default is harmful for long-input grep-count audits — verified empirically 2026-05-07). v0.3.2 (G35): KimiApiBackend — Kimi Coding API HTTP with User-Agent gate. v0.3.1 (G33+G34): reasoning_text capture + deepseek-v4-* thinking-mode extra_body. v0.3.0 (G32): ag1_meta_review() helper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maersk Warehouse Planner Pro infra" }]

dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
xaxiu-swarm = "xaxiu_swarm.cli:main"

[project.urls]
Homepage = "https://github.com/xaxiuegg/xaxiu-swarm"
Source = "https://github.com/xaxiuegg/xaxiu-swarm"
Issues = "https://github.com/xaxiuegg/xaxiu-swarm/issues"
Changelog = "https://github.com/xaxiuegg/xaxiu-swarm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["xaxiu_swarm*"]
