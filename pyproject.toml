[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-swarm"
version = "0.3.0"
description = "Multi-provider agent swarm orchestration: Kimi CLI + DeepSeek + Qwen + Claude. asyncio.gather + git worktree isolation. Pre-authored packets + AG#1 source-trace meta-review. v0.3.0 (G32): ag1_meta_review() helper + agent-swarm ag1 CLI subcommand auto-injecting source-trace verification clause to prevent rubber-stamping cohort findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maersk Warehouse Planner Pro infra" }]

dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
agent-swarm = "agent_swarm.cli:main"

[tool.setuptools.packages.find]
include = ["agent_swarm*"]
