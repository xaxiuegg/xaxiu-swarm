[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaxiu-swarm"
version = "0.3.2"
description = "Multi-provider agent swarm orchestration: Kimi CLI + Kimi Coding API + DeepSeek + Qwen + Claude. asyncio.gather + git worktree isolation. Pre-authored packets + AG#1 source-trace meta-review. v0.3.2 (G35): KimiApiBackend — Kimi Coding API direct HTTP at api.kimi.com/coding/v1 with User-Agent gate (claude-code/0.1.0); replaces fragile Kimi CLI subprocess for orchestrator-driven dispatch. v0.3.1 (G33+G34): reasoning_text capture + deepseek-v4-* thinking-mode extra_body. v0.3.0 (G32): ag1_meta_review() helper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maersk Warehouse Planner Pro infra" }]

dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
xaxiu-swarm = "xaxiu_swarm.cli:main"

[project.urls]
Homepage = "https://github.com/xaxiuegg/xaxiu-swarm"
Source = "https://github.com/xaxiuegg/xaxiu-swarm"
Issues = "https://github.com/xaxiuegg/xaxiu-swarm/issues"
Changelog = "https://github.com/xaxiuegg/xaxiu-swarm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["xaxiu_swarm*"]
