[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaxiu-swarm"
version = "0.4.0"
description = "Multi-provider agent swarm orchestration: Kimi CLI + Kimi Coding API + DeepSeek + Qwen + Claude + OpenCode/MiMo. asyncio.gather + git worktree isolation, pre-authored packets, AG#1 source-trace meta-review. v0.4.0 adds an OpenCode CLI backend driving the Xiaomi MiMo OpenAI-compatible API (auto-generated provider config; MIMO_API_KEY sharding). See CHANGELOG for the full version history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maersk Warehouse Planner Pro infra" }]

dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
xaxiu-swarm = "xaxiu_swarm.cli:main"

[project.urls]
Homepage = "https://github.com/xaxiuegg/xaxiu-swarm"
Source = "https://github.com/xaxiuegg/xaxiu-swarm"
Issues = "https://github.com/xaxiuegg/xaxiu-swarm/issues"
Changelog = "https://github.com/xaxiuegg/xaxiu-swarm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["xaxiu_swarm*"]
